<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090d">
  <title>Anti-Hambreado Voices</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 18px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top left, rgba(255, 30, 75, 0.22), transparent 35%),
        radial-gradient(circle at bottom right, rgba(138, 30, 255, 0.2), transparent 35%),
        #09090d;
    }

    .app {
      width: 100%;
      max-width: 760px;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 25px;
      background: rgba(20, 20, 28, 0.96);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(28px, 7vw, 42px);
    }

    .subtitle {
      margin: 10px 0 25px;
      text-align: center;
      color: #aaaab5;
      line-height: 1.5;
    }

    .label {
      display: block;
      margin: 18px 0 10px;
      font-size: 14px;
      font-weight: bold;
    }

    .voices {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 9px;
    }

    .voice {
      min-height: 90px;
      padding: 12px 6px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 17px;
      color: #c1c1ca;
      background: #181820;
      cursor: pointer;
    }

    .voice.active {
      color: white;
      border-color: #ff375e;
      background: linear-gradient(145deg, rgba(255, 35, 77, 0.32), rgba(150, 30, 255, 0.25));
    }

    .voice strong {
      display: block;
      margin-top: 7px;
      font-size: 13px;
    }

    .voice small {
      display: block;
      margin-top: 4px;
      opacity: 0.65;
    }

    .emoji {
      font-size: 25px;
    }

    textarea {
      width: 100%;
      min-height: 200px;
      padding: 17px;
      resize: vertical;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      outline: none;
      color: white;
      background: #101016;
      font: inherit;
      font-size: 16px;
      line-height: 1.55;
    }

    textarea:focus {
      border-color: #ff375e;
      box-shadow: 0 0 0 4px rgba(255, 55, 94, 0.1);
    }

    select {
      width: 100%;
      min-height: 48px;
      padding: 0 13px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      outline: none;
      color: white;
      background: #17171f;
      font-size: 14px;
    }

    .settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .setting {
      padding: 14px;
      border-radius: 16px;
      background: #16161e;
    }

    .setting-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      color: #c9c9d1;
      font-size: 13px;
      font-weight: bold;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #ff375e;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 60px;
      gap: 11px;
      margin-top: 20px;
    }

    button {
      font: inherit;
    }

    #play {
      min-height: 58px;
      border: none;
      border-radius: 18px;
      color: white;
      background: linear-gradient(135deg, #ff204d, #b71de3);
      box-shadow: 0 12px 32px rgba(255, 32, 77, 0.28);
      cursor: pointer;
      font-weight: bold;
      font-size: 16px;
    }

    #stop {
      min-height: 58px;
      border: none;
      border-radius: 18px;
      color: white;
      background: #2a2a35;
      cursor: pointer;
      font-size: 21px;
    }

    #status {
      min-height: 22px;
      margin: 15px 0 0;
      text-align: center;
      color: #9999a5;
      font-size: 13px;
    }

    #status.error {
      color: #ff718b;
    }

    #status.speaking {
      color: #ff6581;
    }

    @media (max-width: 650px) {
      body {
        align-items: flex-start;
        padding: 12px;
      }

      .app {
        padding: 19px;
      }

      .voices {
        grid-template-columns: repeat(2, 1fr);
      }

      .voice:last-child {
        grid-column: span 2;
      }

      .settings {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>Anti-Hambreado Voices</h1>
    <p class="subtitle">Escribe un texto y selecciona quién lo va a decir.</p>

    <span class="label">Personaje</span>

    <section class="voices">
      <button class="voice active" data-character="felicia">
        <span class="emoji">👩</span>
        <strong>Felicia</strong>
        <small>Mujer joven</small>
      </button>

      <button class="voice" data-character="slowww">
        <span class="emoji">🧑</span>
        <strong>Slowww</strong>
        <small>Adolescente</small>
      </button>

      <button class="voice" data-character="iwoozy">
        <span class="emoji">🎧</span>
        <strong>Iwoozy</strong>
        <small>Adolescente</small>
      </button>

      <button class="voice" data-character="banhammer">
        <span class="emoji">🔨</span>
        <strong>BanHammer</strong>
        <small>Hombre joven</small>
      </button>

      <button class="voice" data-character="angel">
        <span class="emoji">👑</span>
        <strong>Angel</strong>
        <small>Hombre joven</small>
      </button>
    </section>

    <label class="label" for="text">Texto</label>
    <textarea id="text" placeholder="Escribe aquí lo que quieres escuchar...">Hola, bienvenido a Anti-Hambreado Script Team.</textarea>

    <label class="label" for="systemVoice">Voz instalada en tu dispositivo</label>
    <select id="systemVoice">
      <option value="">Cargando voces...</option>
    </select>

    <section class="settings">
      <div class="setting">
        <div class="setting-top">
          <span>Velocidad</span>
          <span id="rateText">1.00x</span>
        </div>
        <input id="rate" type="range" min="0.5" max="1.8" step="0.05" value="1">
      </div>

      <div class="setting">
        <div class="setting-top">
          <span>Tono</span>
          <span id="pitchText">1.20</span>
        </div>
        <input id="pitch" type="range" min="0.5" max="1.8" step="0.05" value="1.2">
      </div>
    </section>

    <section class="buttons">
      <button id="play">▶ Reproducir</button>
      <button id="stop">■</button>
    </section>

    <p id="status">Preparando el lector de voz...</p>
  </main>

  <script>
    const synth = window.speechSynthesis
    const text = document.getElementById("text")
    const systemVoice = document.getElementById("systemVoice")
    const voiceButtons = document.querySelectorAll(".voice")
    const play = document.getElementById("play")
    const stop = document.getElementById("stop")
    const status = document.getElementById("status")
    const rate = document.getElementById("rate")
    const pitch = document.getElementById("pitch")
    const rateText = document.getElementById("rateText")
    const pitchText = document.getElementById("pitchText")

    let voices = []
    let selectedCharacter = "felicia"
    let speakingId = 0

    const characters = {
      felicia: {
        rate: 1,
        pitch: 1.35,
        voiceOffset: 0
      },
      slowww: {
        rate: 1.15,
        pitch: 1.25,
        voiceOffset: 1
      },
      iwoozy: {
        rate: 1.05,
        pitch: 1.1,
        voiceOffset: 2
      },
      banhammer: {
        rate: 0.92,
        pitch: 0.78,
        voiceOffset: 3
      },
      angel: {
        rate: 1,
        pitch: 0.95,
        voiceOffset: 4
      }
    }

    function setStatus(message, type = "") {
      status.textContent = message
      status.className = type
    }

    function getSpanishVoices() {
      const spanish = voices.filter(voice => voice.lang.toLowerCase().startsWith("es"))
      return spanish.length ? spanish : voices
    }

    function loadVoices() {
      voices = synth.getVoices()

      if (!voices.length) {
        systemVoice.innerHTML = '<option value="">Esperando voces del dispositivo...</option>'
        setStatus("Esperando a que Android cargue las voces...")
        return
      }

      const spanishVoices = getSpanishVoices()

      systemVoice.innerHTML = ""

      spanishVoices.forEach((voice, index) => {
        const option = document.createElement("option")
        option.value = String(index)
        option.textContent = `${voice.name} — ${voice.lang}`
        systemVoice.appendChild(option)
      })

      selectCharacterVoice()
      setStatus(`${spanishVoices.length} voces disponibles.`)
    }

    function selectCharacterVoice() {
      const spanishVoices = getSpanishVoices()

      if (!spanishVoices.length) {
        return
      }

      const character = characters[selectedCharacter]
      systemVoice.value = String(character.voiceOffset % spanishVoices.length)
      rate.value = character.rate
      pitch.value = character.pitch
      updateValues()
    }

    function updateValues() {
      rateText.textContent = `${Number(rate.value).toFixed(2)}x`
      pitchText.textContent = Number(pitch.value).toFixed(2)
    }

    function splitText(value) {
      const normalized = value.replace(/\s+/g, " ").trim()
      const pieces = normalized.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || []
      const chunks = []
      let current = ""

      pieces.forEach(piece => {
        if (`${current} ${piece}`.trim().length <= 180) {
          current = `${current} ${piece}`.trim()
        } else {
          if (current) {
            chunks.push(current)
          }

          if (piece.length <= 180) {
            current = piece.trim()
          } else {
            const words = piece.trim().split(" ")
            current = ""

            words.forEach(word => {
              if (`${current} ${word}`.trim().length <= 180) {
                current = `${current} ${word}`.trim()
              } else {
                if (current) {
                  chunks.push(current)
                }
                current = word
              }
            })
          }
        }
      })

      if (current) {
        chunks.push(current)
      }

      return chunks
    }

    function speakChunks(chunks, index, sessionId) {
      if (sessionId !== speakingId || index >= chunks.length) {
        if (sessionId === speakingId) {
          play.textContent = "▶ Reproducir"
          setStatus("Reproducción terminada.")
        }
        return
      }

      const spanishVoices = getSpanishVoices()
      const selectedIndex = Number(systemVoice.value)
      const utterance = new SpeechSynthesisUtterance(chunks[index])

      if (spanishVoices[selectedIndex]) {
        utterance.voice = spanishVoices[selectedIndex]
        utterance.lang = spanishVoices[selectedIndex].lang
      } else {
        utterance.lang = "es-MX"
      }

      utterance.rate = Number(rate.value)
      utterance.pitch = Number(pitch.value)
      utterance.volume = 1

      utterance.onstart = () => {
        play.textContent = "🔊 Reproduciendo..."
        setStatus(`Hablando con la voz de ${selectedCharacter}.`, "speaking")
      }

      utterance.onend = () => {
        speakChunks(chunks, index + 1, sessionId)
      }

      utterance.onerror = event => {
        if (event.error !== "canceled" && event.error !== "interrupted") {
          play.textContent = "▶ Reproducir"
          setStatus(`Error de voz: ${event.error}`, "error")
        }
      }

      synth.speak(utterance)
    }

    function startSpeaking() {
      const value = text.value.trim()

      if (!("speechSynthesis" in window)) {
        setStatus("Este navegador no permite usar texto a voz.", "error")
        return
      }

      if (!value) {
        setStatus("Primero escribe un texto.", "error")
        text.focus()
        return
      }

      if (!voices.length) {
        loadVoices()
      }

      synth.cancel()
      speakingId += 1

      const chunks = splitText(value)

      setTimeout(() => {
        speakChunks(chunks, 0, speakingId)
      }, 150)
    }

    voiceButtons.forEach(button => {
      button.addEventListener("click", () => {
        synth.cancel()
        speakingId += 1
        selectedCharacter = button.dataset.character

        voiceButtons.forEach(item => item.classList.remove("active"))
        button.classList.add("active")

        selectCharacterVoice()
        setStatus(`Personaje seleccionado: ${button.querySelector("strong").textContent}`)
      })
    })

    play.addEventListener("click", startSpeaking)

    stop.addEventListener("click", () => {
      speakingId += 1
      synth.cancel()
      play.textContent = "▶ Reproducir"
      setStatus("Reproducción detenida.")
    })

    rate.addEventListener("input", updateValues)
    pitch.addEventListener("input", updateValues)

    if ("speechSynthesis" in window) {
      loadVoices()
      synth.onvoiceschanged = loadVoices
      setTimeout(loadVoices, 300)
      setTimeout(loadVoices, 1000)
      setTimeout(loadVoices, 2500)
    } else {
      setStatus("Tu navegador no es compatible con el lector de voz.", "error")
      play.disabled = true
    }

    window.addEventListener("beforeunload", () => {
      synth.cancel()
    })
  </script>
</body>
</html>
